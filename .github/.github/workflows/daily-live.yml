name: 实时触发每日抓取(9:24)

on:
  schedule:
    # 每日 09:24 北京时间 = 01:24 UTC（GitHub Actions 使用 UTC）
    - cron: "24 1 * * *"
  workflow_dispatch:

permissions:
  contents: write   # 允许工作流把更新后的 JSON 提交回仓库

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取 159915 集合竞价实时行情
        run: python fetch_live.py

      - name: 提交更新（若有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 实时触发更新 $(date +%F)"
            for i in 1 2 3; do
              git push && break
              echo "push 冲突，拉取后重试 ($i)"; git pull --rebase --autostash origin main || true; sleep 8
            done
          fi

name: 策略信号每日更新(15:00)

on:
  schedule:
    # 每个交易日收盘后 15:00 北京时间 = 07:00 UTC（GitHub Actions 使用 UTC）
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write   # 允许工作流把更新后的 JSON 提交回仓库

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取并计算策略信号/回测
        run: python generate_strategy.py

      - name: 提交更新（若有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 策略信号更新 $(date +%F)"
            for i in 1 2 3; do
              git push && break
              echo "push 冲突，拉取后重试 ($i)"; git pull --rebase --autostash origin main || true; sleep 8
            done
          fi

name: 每日比价数据更新

on:
  schedule:
    - cron: '3 7 * * *'        # 07:03 UTC = 北京 15:03（GitHub Actions 用 UTC）
  workflow_dispatch:           # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成比价数据
        run: python generate_data.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gv_data.json sz_data.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 每日比价数据更新 $(date +'%Y-%m-%d')"
            git push
          fi

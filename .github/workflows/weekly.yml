name: 风格比价周度更新

on:
  schedule:
    # 每周五 15:10 北京时间 = 07:10 UTC（GitHub Actions 使用 UTC）
    - cron: "10 7 * * FRI"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 允许工作流把更新后的 JSON 提交回仓库

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取并计算比价数据
        run: python generate_data.py

      - name: 提交更新（若有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 周度比价更新 $(date +%F)"
            git push
          fi
